[workspace]
members = ["crates/bemo", "crates/bemo-ffi"]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/elide-dev/bemo"

[workspace.dependencies]
# Upstream PR #555 fixes stable state teardown UB; direct pin travels to Cargo consumers.
zlib-rs = { version = "=0.6.7", git = "https://github.com/jlucaso1/zlib-rs.git", rev = "cedb23f2a9329d0bc81d0c8068d74d2b16a24dd6", default-features = false, features = ["std"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
crc32fast = "=1.5.0"
bemo = { path = "crates/bemo", version = "0.3.1", default-features = false }

compio-buf = { version = "=0.8.3", git = "https://github.com/elide-tools/compio.git", rev = "029af1602c7701dd4fc607c9c857a26144153b14" }
compio-driver = { version = "=0.12.5", features = ["polling"], git = "https://github.com/elide-tools/compio.git", rev = "029af1602c7701dd4fc607c9c857a26144153b14" }
nohash-hasher = { version = "0.2.0" }
ntex-httparse = { version = "=2.2.0", git = "https://github.com/elide-tools/ntex-httparse", rev = "104a6749f9b8c973e99e9f84cfd2adcfdef96bbf" }
h2 = { version = "0.4.19" }
http = { version = "1" }
bytes = { version = "1" }
tokio = { version = "1", default-features = false, features = ["net", "io-util", "macros", "rt", "sync", "time"] }
socket2 = { version = "0.6", features = ["all"] }
libc = { version = "0" }
rustls = { version = "=0.23.45", default-features = false }
aws-lc-rs = { version = "=1.18.1", default-features = false }
libmimalloc-sys = { version = "=0.1.49" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
warnings = { level = "deny", priority = -1 }
unused_must_use = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
not_unsafe_ptr_arg_deref = "deny"
mem_forget = "deny"
cast_ptr_alignment = "deny"
transmute_ptr_to_ptr = "deny"
as_ptr_cast_mut = "deny"
uninit_vec = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
manual_c_str_literals = "deny"
implicit_clone = "deny"
redundant_clone = "deny"
needless_collect = "deny"
large_stack_arrays = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
overflow-checks = true
strip = "debuginfo"

# Defer optimization to the consumer's LLVM linker. Keep ordinary release
# artifacts and their Cargo cache separate from the bitcode archive variant.
[profile.bitcode]
inherits = "release"
lto = false
strip = "none"
